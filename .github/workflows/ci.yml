name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: shellcheck
        run: shellcheck install.sh hooks/*.sh tests/*.sh

      - name: syntax check
        run: bash -n install.sh

      - name: claude hook tests
        run: bash tests/test-claude-hook.sh
